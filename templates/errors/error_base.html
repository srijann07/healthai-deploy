<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Error{% endblock %} · {{ app_name }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<div class="error-page">
  <div class="error-icon"><i class="bi bi-heart-pulse"></i></div>
  <div class="error-code">{% block code %}{% endblock %}</div>
  <h1 class="error-heading">{% block heading %}{% endblock %}</h1>
  <p class="error-message text-secondary">{% block message %}{% endblock %}</p>
  <a class="btn btn-primary" href="{{ url_for('main.index') }}">
    <i class="bi bi-house me-2"></i>Back to home
  </a>
</div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
