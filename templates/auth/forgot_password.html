{% extends "auth/auth_base.html" %}
{% block title %}Forgot password{% endblock %}

{% block form %}
<h1 class="auth-title">Reset your password</h1>
<p class="auth-subtitle">Enter your account email and we'll send you a secure reset link.</p>

<form method="POST" action="{{ url_for('auth.forgot_password_page') }}" data-loading novalidate>
  <div class="mb-4">
    <label class="form-label" for="email">Email address</label>
    <div class="input-group">
      <span class="input-group-text"><i class="bi bi-envelope"></i></span>
      <input type="email" class="form-control" id="email" name="email"
             placeholder="you@example.com" required autofocus autocomplete="email">
    </div>
  </div>

  <button type="submit" class="btn btn-primary btn-lg w-100">
    <span class="btn-label">Send reset link</span>
    <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
  </button>
</form>

<p class="auth-switch">
  <a class="auth-link" href="{{ url_for('auth.login_page') }}">
    <i class="bi bi-arrow-left me-1"></i>Back to sign in
  </a>
</p>
{% endblock %}
