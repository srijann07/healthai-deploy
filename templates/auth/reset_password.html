{% extends "auth/auth_base.html" %}
{% block title %}Choose new password{% endblock %}

{% block form %}
<h1 class="auth-title">Choose a new password</h1>
<p class="auth-subtitle">Your new password must be at least 8 characters with letters and numbers.</p>

<form method="POST" action="{{ url_for('auth.reset_password_page', token=token) }}" data-loading novalidate>
  <div class="mb-3">
    <label class="form-label" for="password">New password</label>
    <div class="input-group">
      <span class="input-group-text"><i class="bi bi-lock"></i></span>
      <input type="password" class="form-control" id="password" name="password"
             placeholder="New password" required autofocus autocomplete="new-password">
      <button class="btn btn-outline-secondary" type="button" data-toggle-password="#password"
              aria-label="Show password"><i class="bi bi-eye"></i></button>
    </div>
  </div>

  <div class="mb-4">
    <label class="form-label" for="confirm_password">Confirm new password</label>
    <div class="input-group">
      <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
      <input type="password" class="form-control" id="confirm_password" name="confirm_password"
             placeholder="Repeat new password" required autocomplete="new-password">
    </div>
  </div>

  <button type="submit" class="btn btn-primary btn-lg w-100">
    <span class="btn-label">Update password</span>
    <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
  </button>
</form>

<p class="auth-switch">
  <a class="auth-link" href="{{ url_for('auth.login_page') }}">
    <i class="bi bi-arrow-left me-1"></i>Back to sign in
  </a>
</p>
{% endblock %}
